    <div th:fragment="detail" style="display: none;" id="b1501w11_m1">

            <div class="aci-sticky-table-dataarea" style="width: 1300px; height: 480px;">
                <template id="b1501w11_meisai_template">

                            </div>
                            <div class="dydmmeion">

                                    data-kaishuhohokbn="{kaishuhohokbn}" 
                                    data-renban="{renban}">
                                    {dydmmei}
                                </a>
                            </div>
                        </td>
                        <td class="num">
                            <!-- // 「レギュラー有料」ラベル -->
                            <span class="aci-format-label">{rgrayuryomei}</span>
                        </td>
                        <td class="num">
                            <!-- // 「レギュラー無料明細」ラベル -->
                            <span class="aci-format-label">{rgramuryomei}</span>
                        </td>
                        <td class="num">
                            <!-- // 「スリム有料明細」ラベル -->
                            <span class="aci-format-label">{srmyuryomei}</span>

                        <td class="num">

                        <td class="num">

                        <td class="str">
                            <!-- // 「回収方法」ラベル -->

                        <input type="hidden" id="meisaiBeanList[{index}].shohitaxkbnmei" name="meisaiBeanList[{index}].shohitaxkbnmei" value="{shohitaxkbnmei}" />
