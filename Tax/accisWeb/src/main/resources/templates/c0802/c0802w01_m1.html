<!doctype HTML>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
</head>

<!--/*
   システム名:AP総合管理システム
   機能名:受注予約登録
*/-->
<body>
    <div th:fragment="detail">
        <div class="listbodyheader">
            <div id="juchubody" style="position: relative; margin-top: 5px;" class="block">
                <h4 style="position: relative; top: 3px;">受注明細情報</h4>
                <div style="position: absolute; top: 0px; left: 0px; width: 1002px;">
                    <span style="position: relative; left: 100px;">
                        <!-- // 「ボタンお気に入り」ボタン -->
                        <button id="btnokini" th:name="btnokini" class="button aci-search" style="width: 120px;"
                            data-api="/api/c0802w01/okinilist/{apkihoncd}/{shopcd}" data-query-filters='[
                                    "baseBean.*"
                            ]' data-bind_target="c0802w01_meisai_list" type="button">明細表示(お気に入り)</button>
                    </span>
                    <span style="position: absolute; right: 0px; text-align: right;">
                        <!-- // 「ボタン行追加」ボタン -->
                        <button id="btngyotsuika" data-action-id="btngyotsuika_madd" name="btngyotsuika" class="button"
                            type="button" style="display: none; width: 60px;">
                            行追加
                        </button>
                        <button style="width: 60px;" id="btngyotuika" name="btngyotuika" class="ifm-mode-enable"
                            type="button">行追加</button>
                        <!-- // 「行追加用商品コード」隠しフィールド -->
                        <input type="hidden" th:field="*{baseBean.shncdadd}" />
                    </span>
                    <button id="btngyosonyu" th:name="btngyosonyu" class="button aci-search" style="display: none;"
                        data-api="/api/c0802w01/gyosonyu/{apkihoncd}/{shopcd}" data-query-filters='[
                                    "baseBean.*"
                            ]' data-bind_target="c0802w01_meisai_list" type="button">行挿入</button>
                    <input type="hidden" th:field="*{baseBean.renkeishncd}" />
                    <button id="btngyofukusha" th:name="btngyofukusha" class="button aci-search" style="display: none;"
                        data-api="/api/c0802w01/gyofukusha" data-query-filters='[
                                    "baseBean.*"
                            ]' data-bind_target="c0802w01_meisai_list" type="button">行複写</button>
                    <input type="hidden" th:field="*{baseBean.meisaiindex}" />

                </div>
                <!--/* レイアウト調整のためのdiv */-->
                <div>&nbsp;</div>
                <div id="orderdetailbody" class="scroll-tooltip"
                    style="position: relative; width: 1408px; height: 280px; overflow: auto;">
                    <div id="orderdetailbody2" style="position: relative;width: 1408px;height: 1px;">
                        <div class="listbodyheader listbodyheader2">
                            <!--<% //----- 明細テーブル ----- %>-->
                            <template id="c0802w01_meisai_template">
                                <tr style='line-height: 15px;'>
                                    <td style="width: 77px; text-align: center;">
                                        <button style="width: 33px;" id="'btngyosonyu[{index}]'"
                                            name="'btngyosonyu[{index}]'" class="ifm-mode-enable"
                                            type="button">挿入</button>
                                        <button style="width: 33px;" id="'btngyofukusha[{index}]'"
                                            name="'btngyofukusha[{index}]'" class="ifm-mode-enable"
                                            type="button">複写</button> </td>
                                    <td style="width: 45px; text-align: center;">{shncd}
                                        <input type="hidden" id="detailBeanList[{index}].shncd"
                                            name="detailBeanList[{index}].shncd" value="{shncd}" />
                                    </td>
                                    <td style="width: 183px; padding: 2px;">{shnnmryakusho}
                                        <input type="hidden" id="detailBeanList[{index}].shnnmryakusho"
                                            name="detailBeanList[{index}].shnnmryakusho" value="{shnnmryakusho}" />
                                    </td>
                                    <td style="width: 52px; padding-left: 2px;">{iro}
                                        <input type="hidden" id="detailBeanList[{index}].iro"
                                            name="detailBeanList[{index}].iro" value="{iro}" />
                                    </td>
                                    <td style="width: 52px; padding-left: 2px;">{sz}
                                        <input type="hidden" id="detailBeanList[{index}].sz"
                                            name="detailBeanList[{index}].sz" value="{sz}" />
                                    </td>
                                    <td style="width: 106px; padding: 2px;">
                                        <select name="detailBeanList[{index}].katasiki"
                                            id="detailBeanList[{index}].katasiki" class="katasiki aci-load"
                                            data-template="template_select" data-default="{katasiki}"
                                            data-api="/api/parts/s02m012t/{apkihoncd}/{shncd}" data-params='{
                                            "blank":"t"
                                            }' data-cache="true" data-tablerow="{index}">
                                        </select></td>
                                    <td style="width: 75px;">
                                        <select name="detailBeanList[{index}].keijokbn"
                                            id="detailBeanList[{index}].keijokbn" class="keijokbn aci-ajax-parts"
                                            data-template="template_select" data-default="{keijokbn}"
                                            data-api="/api/c0802w01/keijyokubun/{tokuisakikbn}" data-params='{
                                            "blank":"t"
                                            }' data-cache="true" data-tablerow="{index}">
                                        </select></td>
                                    <td style="width: 70px;">
                                        <input type="text" id="detailBeanList[{index}].acptsuryo"
                                            name="detailBeanList[{index}].acptsuryo" value="{acptsuryo}" size="8"
                                            class="acptsuryo aci-amount-format num" maxlength="7"
                                            data-allow-number-of-decimals="1" data-tablerow="{index}" style="width: 40px;" />
                                        <span>{uritrtskitani}</span>
                                        <input type="hidden" id="detailBeanList[{index}].uritrtskitani"
                                            name="detailBeanList[{index}].uritrtskitani" value="{uritrtskitani}" />
                                    </td>
                                    <td style="width: 54px; text-align: right; padding-right: 2px;">
                                        <span class="aci-format-label">{uriirisu}</span>
                                        <span>{uritani}</span>
                                        <input type="hidden" id="detailBeanList[{index}].uriirisu"
                                            name="detailBeanList[{index}].uriirisu" value="{uriirisu}" size="8"
                                            class="aci-amount-format num" maxlength="6" style="width: 40px;" />
	                                    <input type="hidden" id="detailBeanList[{index}].uritani"
	                                        name="detailBeanList[{index}].uritani" value="{uritani}" />    
                                    </td>
                                    <td style="width: 50px; text-align: right; padding-right: 2px;">
                                        <span class="aci-format-label sokazu-label{index} num_label">{sokazu}</span>
                                        <input type="hidden" id="detailBeanList[{index}].sokazu"
                                            name="detailBeanList[{index}].sokazu" value="{sokazu}" size="8"
                                            class="aci-amount-format num_label" maxlength="6" style="width: 40px;" />
                                    </td>
                                    <td style="width: 68px; text-align: right; padding-right: 2px;">
                                        <span class="aci-format-label num_label">{hyojununt}</span>
                                        <input type="hidden" id="detailBeanList[{index}].hyojununt"
                                            name="detailBeanList[{index}].hyojununt" value="{hyojununt}" size="8"
                                            class="aci-amount-format num_label" maxlength="11" style="width: 40px;" />
                                    </td>
                                    <td style="width: 72px; text-align: right; padding-right: 2px;">
                                        <input type="text" id="detailBeanList[{index}].acptunt"
                                            name="detailBeanList[{index}].acptunt" value="{acptunt}" size="12"
                                            class="acptunt aci-amount-format num" data-tablerow="{index}" maxlength="12"
                                            data-allow-number-of-decimals="2" style="width:60px" /></td>
                                    <td
                                        style="width: 63px; padding-right : 2px; text-align: right; padding-right: 2px;">
                                        <span class="aci-format-label num_label" id="detailBeanList[{index}].kin"
                                            name="detailBeanList[{index}].kin">{kin}</span>
                                        <input type="hidden" id="detailBeanList[{index}].kin"
                                            name="detailBeanList[{index}].kin" value="{kin}" />
                                    </td>
                                    <td
                                        style="width: 50px; padding-right : 2px; text-align: right; padding-right: 2px;">
                                        <input type="text" id="detailBeanList[{index}].soukaisumei"
                                            name="detailBeanList[{index}].soukaisumei" value="{soukaisumei}" size="2"
                                            class="soukaisumei aci-amount-format num" data-tablerow="{index}"
                                            data-allow-number-of-decimals="0" maxlength="3" style="width: 20px;" /><span>回</span></td>
                                    <td style="width: 50px; padding-right : 2px; text-align: right;">
                                        <input type="text" id="detailBeanList[{index}].zankaisumei"
                                            name="detailBeanList[{index}].zankaisumei" value="{zankaisumei}" size="2"
                                            class="zankaisumei aci-amount-format num" data-tablerow="{index}"
                                            data-allow-number-of-decimals="0" maxlength="3" style="width: 20px;" /><span>回</span></td>
                                    <td style="padding: 2px 4px; width: 60px">
                                        <button style="width: 55px;" id="'btnlink[{index}]'" name="'btnlink[{index}]'"
                                            class="ifm-mode-enable" type="button">リンク</button>
                                    </td>
                                    <td style="width: 215px;">
                                        <input type="text" id="detailBeanList[{index}].meisaibiko"
                                            name="detailBeanList[{index}].meisaibiko" value="{meisaibiko}" size="40"
                                            maxlength="40" class="meisaibiko str" data-tablerow="{index}"
                                            style="width:217px;" />
                                        <input type="hidden" id="detailBeanList[{index}].lctgrycd"
                                            name="detailBeanList[{index}].lctgrycd" value="{lctgrycd}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].mctgrycd"
                                            name="detailBeanList[{index}].mctgrycd" value="{mctgrycd}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].sctgrycd"
                                            name="detailBeanList[{index}].sctgrycd" value="{sctgrycd}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].gyono"
                                            name="detailBeanList[{index}].gyono" value="{gyono}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].updateflg"
                                            name="detailBeanList[{index}].updateflg" value="{updateflg}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].taxkbn"
                                            name="detailBeanList[{index}].taxkbn" value="{taxkbn}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].yusyokbn"
                                            name="detailBeanList[{index}].yusyokbn" value="{yusyokbn}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].meisaikbn"
                                            name="detailBeanList[{index}].meisaikbn" value="{meisaikbn}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].nyuryokumeisaiflg"
                                            name="detailBeanList[{index}].nyuryokumeisaiflg" value="{nyuryokumeisaiflg}"
                                            class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].tanpinmeisaiflg"
                                            name="detailBeanList[{index}].tanpinmeisaiflg" value="{tanpinmeisaiflg}"
                                            class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].stshncd"
                                            name="detailBeanList[{index}].stshncd" value="{stshncd}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].acptdnpymeisaino"
                                            name="detailBeanList[{index}].acptdnpymeisaino" value="{acptdnpymeisaino}"
                                            class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].acptdnpymeisaiedano"
                                            name="detailBeanList[{index}].acptdnpymeisaiedano"
                                            value="{acptdnpymeisaiedano}" class="str" />
                                        <input type="hidden" id="detailBeanList[{index}].acptuntshohitaxkin"
                                            name="detailBeanList[{index}].acptuntshohitaxkin" value="" />
                                        <input type="hidden" id="detailBeanList[{index}].acptshohitaxkin"
                                            name="detailBeanList[{index}].acptshohitaxkin" value="" />
                                        <input type="hidden" id="detailBeanList[{index}].hyojunpricekirikaedd"
                                            name="detailBeanList[{index}].hyojunpricekirikaedd"
                                            value="{hyojunpricekirikaedd}" />
                                        <input type="hidden" id="detailBeanList[{index}].genzhyojunprice"
                                            name="detailBeanList[{index}].genzhyojunprice" value="{genzhyojunprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].shinhyojunprice"
                                            name="detailBeanList[{index}].shinhyojunprice" value="{shinhyojunprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].genzhyojunmochikaeriprice"
                                            name="detailBeanList[{index}].genzhyojunmochikaeriprice"
                                            value="{genzhyojunmochikaeriprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].shinhyojunmochikaeriprice"
                                            name="detailBeanList[{index}].shinhyojunmochikaeriprice"
                                            value="{shinhyojunmochikaeriprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].shoppricekirikaedd"
                                            name="detailBeanList[{index}].shoppricekirikaedd"
                                            value="{shoppricekirikaedd}" />
                                        <input type="hidden" id="detailBeanList[{index}].genzshopprice"
                                            name="detailBeanList[{index}].genzshopprice" value="{genzshopprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].shinshopprice"
                                            name="detailBeanList[{index}].shinshopprice" value="{shinshopprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].genzshopmochikaeriprice"
                                            name="detailBeanList[{index}].genzshopmochikaeriprice"
                                            value="{genzshopmochikaeriprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].shinshopmochikaeriprice"
                                            name="detailBeanList[{index}].shinshopmochikaeriprice"
                                            value="{shinshopmochikaeriprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].hansokustrtdd"
                                            name="detailBeanList[{index}].hansokustrtdd" value="{hansokustrtdd}" />
                                        <input type="hidden" id="detailBeanList[{index}].hansokushrydd"
                                            name="detailBeanList[{index}].hansokushrydd" value="{hansokushrydd}" />
                                        <input type="hidden" id="detailBeanList[{index}].hansokuprice"
                                            name="detailBeanList[{index}].hansokuprice" value="{hansokuprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].hansokumochikaeriprice"
                                            name="detailBeanList[{index}].hansokumochikaeriprice"
                                            value="{hansokumochikaeriprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].ttpricestrtdd"
                                            name="detailBeanList[{index}].ttpricestrtdd" value="{ttpricestrtdd}" />
                                        <input type="hidden" id="detailBeanList[{index}].ttpriceshrydd"
                                            name="detailBeanList[{index}].ttpriceshrydd" value="{ttpriceshrydd}" />
                                        <input type="hidden" id="detailBeanList[{index}].ttprice"
                                            name="detailBeanList[{index}].ttprice" value="{ttprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].ttmochikaeriprice"
                                            name="detailBeanList[{index}].ttmochikaeriprice"
                                            value="{ttmochikaeriprice}" />
                                        <input type="hidden" id="detailBeanList[{index}].shokidsplyprice"
                                            name="detailBeanList[{index}].shokidsplyprice" value="{acptunt}" />
                                        <input type="hidden" id="detailBeanList[{index}].pricekbn"
                                            name="detailBeanList[{index}].pricekbn" value="{pricekbn}" />
                                        <input type="hidden" id="detailBeanList[{index}].tokuisakikbn"
                                            name="detailBeanList[{index}].tokuisakikbn" value="{tokuisakikbn}" />
                                    </td>
                                </tr>
                            </template>
                            <table class="grid border aci-sticky-table aci-table-data" id="orderdetailbodytable"
                                style="position: relative;margin-bottom:2px;">
                                <thead>
                                    <tr>
                                        <th style="width: 77px; height: 16px;"></th>
                                        <th style="width: 45px;">商品CD</th>
                                        <th style="width: 187px;">商品略称名</th>
                                        <th style="width: 54px;">色</th>
                                        <th style="width: 54px;">サイズ</th>
                                        <th style="width: 110px;">型式</th>
                                        <th class="hissu" style="width: 75px;">計上区分</th>
                                        <th style="width: 70px;">数量</th>
                                        <th style="width: 54px;">入数</th>
                                        <th style="width: 50px;">総数</th>
                                        <th style="width: 68px;">標準価格</th>
                                        <th style="width: 72px;">販売価格</th>
                                        <th style="width: 63px;">金額</th>
                                        <th style="width: 52px;">総回数</th>
                                        <th style="width: 52px;">残回数</th>
                                        <th style="width: 69px;"></th>
                                        <th style="padding: 2px; width: 211px; text-align: left;">明細備考</th>
                                    </tr>
                                </thead>
                                <tbody class="aci-load" id="c0802w01_meisai_list"
                                    data-template="c0802w01_meisai_template">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="orderdetailtailheadarea"
                    style="position: relative; width: 1270px; overflow: hidden; height: 22px;">
                    <div id="orderdetailtailheadarea2" style="position: relative; width: 1198px; height: 22px;">
                        <table id="orderdetailtail" class="border" style="width: 1109px;">
                            <col width="115">
                            <col width="65">
                            <col width="10">
                            <col width="115">
                            <col width="60">
                            <col width="10">
                            <col width="55">
                            <col width="60">
                            <col width="230">
                            <col width="377">
                            <tr style="height: 21px;">
                                <!--/* <td style="background-color: #cccccc; width: 490px;" rowspan="1"></td> */-->
                                <th rowspan="2" style="background-color: #ccffcc;">税込み合計</th>
                                <td style="text-align: right">
                                    <!-- // 「合計」テキストボックスリードオンリー -->
                                    <span class="num_label" id="sm" th:text="*{meisaiBean.summaryBean.sm}"></span>
                                </td>
                                <td style="background-color: #cccccc" rowspan="2"></td>
                                <th rowspan="2">消費税</th>
                                <td style="text-align: right">
                                    <!-- // 「消費税金額」テキストボックスリードオンリー -->
                                    <span class="num_label" id="shohitaxkin" th:text="*{meisaiBean.summaryBean.shohitaxkin}"></span>
                                </td>
                                <td style="background-color: #cccccc" rowspan="2"></td>
                                <th rowspan="2">合計</th>
                                <td style="text-align: right">
                                    <!-- // 「受注金額」テキストボックスリードオンリー -->
                                    <span class="num_label" id="acptkin" th:text="*{meisaiBean.summaryBean.acptkin}" ></span>
                                </td>
                                <td style="background-color: #cccccc; width: 285px;" rowspan="2" colspan="2">&nbsp;</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
