<!doctype HTML>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!--/*
    C0801W02_受注登録（受注登録）
*/-->
<head>
    <title>[(${headerTitle})]</title>
    <th:block th:replace="commons/layout.html :: configFragment"></th:block>
    <link th:href="@{/css/commons/aci/common.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/commons/ifm.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/c0801/c0801w00.css}" rel="stylesheet" type="text/css">

    <script type="module" class="aci-module aci-module-page" th:src="@{/js/c0801/c0801w02.js}"></script>
    
    <!--/* ページ独自のスタイル定義 */-->
    <style>
    .ifm-multicontrol tr td label {
        top: 2px !important;
    }
    #display table tr th {
        padding: 2px;
    }
    
    #display button:disabled {
        color: #A0A0A0;
    }
    /* set CSS for Chrome 29+ only */
    @media screen and (-webkit-min-device-pixel-ratio:0) and (min-resolution:.001dpcm) {
        select:disabled{
            color: gray;
            }
    }
    span.message {
        position: absolute;
        top: 3px;
        color: #f33;
        font-weight: bold;
    }
    .vertical-writing {
        padding: 1px;
        display: table-cell;
        writing-mode: vertical-rl;
        vertical-align: middle;
        text-align: center;
    }
    #orderdetailbodytable td.nowrap {
        white-space: nowrap;
    }
    #c0801w02_base_previous td:empty {
        height: 10px;
    }
    .order-list-area {
        width : 1280px;
    }
    #juchuhaifu input:read-only:not([type="button"]), #c0801w02_meisai_list input:read-only:not([type="button"]) {
        background-color: inherit;
        border: 0px;
    }
    </style>
</head>

<body>
    <!--/* プルダウン用テンプレート定義 */-->
    <template id="template_select">
        <option value="{value}">{label}</option>
    </template>
    <!--/* 処理区分ラジオボタンテンプレート */-->
    <template id="template_radio_prcskbn">
        <label class="form-check-label">
            <input type="radio"
                value="{value}"
                id="baseBean.prcskbn{index}"
                name="baseBean.prcskbn"
                class="form-check-input"
            >
            {label}
        </label>
    </template>
    <!--/* 受注区分ラジオボタンテンプレート */-->
    <template id="template_radio_acptkbn">
        <label class="form-check-label">
            <input type="radio"
                value="{value}"
                id="meisaiBean.acptkbn{index}"
                name="meisaiBean.acptkbn"
                class="form-check-input"
                th:disabled="${c0801W02Form.baseBean.authflag != 'f'}"
            >
            {label}
        </label>
    </template>

    
    <!--/* フォーム定義 th:objectはc0801W02Form */-->
    <form th:method="post" th:action="@{/c0801w02}" th:object="${c0801W02Form}">
        <!--* 共通ヘッダー部 */-->
        <div th:replace="commons/header.html :: header"></div>
        <!--* AP/ショップ選択部 */-->
        <th:block th:replace="z0101/z0101w01 :: basic_fix" />
        <!--* ローディングアイコン */-->
        <div id="aci-ajaxloader"></div>
        <!--* メッセージエリア */-->
        <div id="message_area" class="ifm-message-area"></div>
        <!--* メッセージ取り込み */-->
        <div th:replace="commons/messages.html :: basic"></div>
        <th:block>
            <!--/* 初期表示エラー情報 */-->
            <input th:field="*{dialogmessage}" type="hidden">
        </th:block>
        <!--/* 業務エリア */-->
        <div id="display">
            <!--* 得意先共通ヘッダー部 */-->
            <th:block th:replace="z0501/z0501w01.html :: syorimode1" />
        <div id="c0801w02_main" style="display: none;">
            <!--/* 隠しフィールド定義 */-->
            <div>
                <!--/* 消費税率情報 */-->
                <th:block th:each="taxInfo : *{taxInfoList}">
                    <input
                        type="hidden"
                        th:data-index="${taxInfoStat.index}"
                        th:id="|taxInfoList[__${taxInfoStat.index}__].taxkbn|"
                        th:name="|taxInfoList[__${taxInfoStat.index}__].taxkbn|"
                        th:value="${taxInfo.taxkbn}">
                    <input
                        type="hidden"
                        th:data-index="${taxInfoStat.index}"
                        th:id="|taxInfoList[__${taxInfoStat.index}__].tekiyostrtdd|"
                        th:name="|taxInfoList[__${taxInfoStat.index}__].tekiyostrtdd|"
                        th:value="${taxInfo.tekiyostrtdd}">
                    <input
                        type="hidden"
                        th:data-index="${taxInfoStat.index}"
                        th:id="|taxInfoList[__${taxInfoStat.index}__].tekiyoshrydd|"
                        th:name="|taxInfoList[__${taxInfoStat.index}__].tekiyoshrydd|"
                        th:value="${taxInfo.tekiyoshrydd}">
                    <input
                        type="hidden"
                        th:data-index="${taxInfoStat.index}"
                        th:id="|taxInfoList[__${taxInfoStat.index}__].shohitax|"
                        th:name="|taxInfoList[__${taxInfoStat.index}__].shohitax|"
                        th:value="${taxInfo.shohitax}">
                </th:block>
                <!--/* 権限フラグ */-->
                <input th:field="*{baseBean.authflag}" type="hidden">
                <!--/* AP基本コード */-->
                <input th:field="*{baseBean.apkihoncd}" type="hidden">
                <!--/* ショップコード */-->
                <input th:field="*{baseBean.shopcd}" type="hidden">
                <!--/* 得意先コード */-->
                <input th:field="*{baseBean.tokuisakicd}" type="hidden">
                <!--/* 受注伝票番号 */-->
                <input th:field="*{baseBean.acptdnpyno}" type="hidden">
                <!--/* 枝番号 */-->
                <input th:field="*{baseBean.edano}" type="hidden">
                <!--/* 遷移元機能ID */-->
                <input th:field="*{baseBean.beforekinoid}" type="hidden">
                <!--/* 伝票ステータス */-->
                <input th:field="*{baseBean.dnpysts}" type="hidden">
                <!--/* データ作成元区分 */-->
                <input th:field="*{baseBean.datsksmotokbn}" type="hidden">
                <!--/* データ作成元区分名 */-->
                <input th:field="*{baseBean.datsksmotokbnnm}" type="hidden">
                <!--/* 配達管轄AP基本コード */-->
                <input th:field="*{baseBean.dlvrykankatsuapkihoncd}" type="hidden">
                <!--/* 配達管轄ショップコード */-->
                <input th:field="*{baseBean.dlvrykankatsushopcd}" type="hidden">
                <!--/* 検索用AP基本コード */-->
                <input th:field="*{baseBean.apkihoncdForSearchDlvry}" type="hidden">
                <!--/* 検索用ショップコード */-->
                <input th:field="*{baseBean.shopcdForSearchDlvry}" type="hidden">
                <!--/* 拠点ステータス */-->
                <input th:field="*{baseBean.kyotensts}" type="hidden">
                <!--/* 配達拠点コード */-->
                <input th:field="*{baseBean.dlvrykyotencd}" type="hidden">
                <!--/* 配達エリアコード */-->
                <input th:field="*{baseBean.dlvryareacd}" type="hidden">
                <!--/* 配達拠点コード（初期値） */-->
                <input id="initDlvrykyotencd" name="initDlvrykyotencd" th:value="*{baseBean.dlvrykyotencd}" type="hidden">
                <!--/* 配達エリアコード（初期値） */-->
                <input id="initDlvryareacd" name="initDlvryareacd" th:value="*{baseBean.dlvryareacd}" type="hidden">
                <!--/* 配達パターン */-->
                <input th:field="*{baseBean.dlvrypattern}" type="hidden">                
                <!--/* 配達会社コード */-->
                <input th:field="*{baseBean.dlvrycmpnycd}" class="binding-calculator-property" type="hidden">
                <!--/* 配達担当者コード */-->
                <input th:field="*{baseBean.dlvrytnshacd}" maxlength="6" class="code" type="hidden">
                <!--/* 配達区分 */-->
                <input th:field="*{baseBean.dlvrykbn}" type="hidden">
                <!--/* 得意先区分 */-->
                <input th:field="*{baseBean.tokuisakikbn}" type="hidden">
                <!--/* 受託配達顧客区分 */-->
                <input th:field="*{baseBean.jutakudlvrycstkbn}" type="hidden">
                <!--/* 委託相手AP基本コード */-->
                <input th:field="*{baseBean.itakuaiteapkihoncd}" type="hidden">
                <!--/* 委託相手ショップコード */-->
                <input th:field="*{baseBean.itakuaiteshopcd}" type="hidden">
                <!--/* 委託相手得意先コード */-->
                <input th:field="*{baseBean.itakuaitetokuisakicd}" type="hidden">
                <!--/* 委託相手受注伝票番号 */-->
                <input th:field="*{baseBean.itakuaiteacptdnpyno}" type="hidden">
                <!--/* 状態ステータス */-->
                <input th:field="*{baseBean.jotaists}" type="hidden">
                <!--/* 得意先状態 */-->
                <input th:field="*{baseBean.tokuisakijotai}" type="hidden">
                <!--/* インボイス施行日 */-->
                <input th:field="*{baseBean.invoicshikoymd}" type="hidden">
                <!--/* 受注担当者AP基本コード */-->
                <input th:field="*{baseBean.acpttnshaapkihoncd}" type="hidden">
                <!--/* 受注担当者ショップコード */-->
                <input th:field="*{baseBean.acpttnshashopcd}" type="hidden">
                <!--/* 受注担当者コード */-->
                <input th:field="*{baseBean.acpttnshacd}" type="hidden">
                <!--/* 有効区分 */-->
                <input th:field="*{baseBean.yukokbn}" type="hidden">
                <!--/* 請求区分 */-->
                <input th:field="*{baseBean.skykbn}" type="hidden">
                <!--/* 回収方法区分 */-->
                <input th:field="*{baseBean.kaishuhohokbn}" type="hidden">
                <!--/* 受注時代引フラグ */-->
                <input th:field="*{baseBean.acptthdaibikiflg}" type="hidden">
                <!--/* 初期表示の際に明細を検索させるための隠しボタン */-->
                <button
                    id="btnmeisaikensaku"
                    type="button"
                    th:name="btnmeisaikensaku"
                    class="button aci-search"
                    style="display: none;"
                    th:data-api="@{/api/c0801w02/meisailist}"
                    data-bind_target="c0801w02_meisai_list">検索</button>  
            </div>
            <!--/* 受注基本情報エリア */-->
            <!--/* 受注伝票 */-->
            <div id="c0801w02_base" class="block" style="position: relative; width: 1052px; margin-left: 5px;" th:object="${c0801W02Form.baseBean}">
                <h4>受注基本情報</h4>
                <!--* (メッセージ1) */-->
                <span id="baseBean.msg1" style="left: 100px;" class="message" th:text="*{msg1}"></span>
                <!--* (メッセージ2) */-->
                <span id="baseBean.msg2" style="left: 400px;" class="message" th:text="*{msg2}"></span>
                <!--* 受注基本情報テーブルレイアウト部分 */-->
                <table  style="border-spacing:0;border-collapse:collapse;" class="border blocksmall">
                    <!--* 列幅指定 */-->
                    <colgroup>
                        <col width="68">
                        <col width="89">
                        <col width="96"> 
                        <col width="50">
                        <col width="346">
                        <col width="70">
                        <col width="120">
                        <col width="60">
                        <col width="154">
                    </colgroup>
                    <tr>
                        <!--* 処理区分 */-->
                        <td align="center" valign="top" colspan="3">
                            <div
                                id="rdoPrcskbn"
                                class="aci-ajax-parts"
                                data-template="template_radio_prcskbn"
                                data-api="/api/c0801w02/prcskbnlist"
                                th:data-default="*{prcskbn}"
                                data-cache="true"
                                >
                            </div>
                        </td>
                        <!--* 配達拠点・エリア */-->
                        <th rowspan="2" class="hissu">配達拠点<br>・エリア</th>
                        <td rowspan="2">
                            <table style="border-spacing:0; border-collapse:collapse; border:none; width:100%;">
                                <tr style="border: none;">
                                    <td style="border: none;">
                                        <!--/* 「配達拠点コード」プルダウン */-->
                                        <!--/* 処理区分に関係なく、委託元かつ他拠点の場合は非活性 */-->
                                        <select style="width: 85%;"
                                            th:disabled="*{authflag != 'f' || (itakumoto && kyotensts == '1')}"
                                            id="plddlvrykyoten"
                                            name="plddlvrykyoten"
                                            data-hidden-element="baseBean.dlvrykyotencd"
                                            class="aci-ajax-parts coodinate-hidden-element"
                                            data-template="template_select"
                                            th:data-default="*{dlvrykyotencd}"
                                            th:data-api="|/api/c0801w02/kyotenlist/*{apkihoncdForSearchDlvry}/*{shopcdForSearchDlvry}|"
                                            >
                                        </select>
                                    </td>
                                </tr>
                                <tr style="border: none;">
                                    <td style="border: none;">
                                        <!--/* 「配達エリアコード」プルダウン */-->
                                        <!--/* 処理区分に関係なく、委託元かつ他拠点の場合は非活性 */-->
                                        <select style="width: 70%;"
                                            th:disabled="*{authflag != 'f' || (itakumoto && kyotensts == '1')}"
                                            id="plddlvryarea"
                                            name="plddlvryarea"
                                            data-hidden-element="baseBean.dlvryareacd"
                                            class="aci-ajax-parts coodinate-hidden-element"
                                            data-template="template_select"
                                            th:data-default="*{dlvryareacd}"
                                            th:data-api="|/api/c0801w02/arealist/*{apkihoncdForSearchDlvry}/*{shopcdForSearchDlvry}/*{dlvrykyotencd}|"
                                            >
                                        </select>
                                        <!--/* 「他拠点／自拠点」ボタン */-->
                                        <!--/* 処理区分が更新の場合は非活性、新規の場合は委託元かつ拠点ステータスが「他拠点」の場合のみ活性 */-->
                                        <button id="btnkyoten"
                                            name="btnkyoten"
                                            type="button"
                                            class="button"
                                            th:disabled="*{authflag != 'f' || prcskbn != '1' || !itakumoto || (itakumoto && kyotensts == '0')}">
                                            他拠点／自拠点
                                        </button>
                                    </td>
                                </tr>
                            </table>
                        </td>
                        <th class="hissu">配達会社</th>
                        <td colspan="3">
                            <!--/* 「配達会社」プルダウン */-->
                            <select style="width: 34%;"
                                th:disabled="*{authflag != 'f'}"
                                id="plddlvrycmpny"
                                name="plddlvrycmpny"
                                class="aci-ajax-parts coodinate-hidden-element"
                                data-hidden-element="baseBean.dlvrycmpnycd"
                                data-template="template_select"
                                th:data-default="*{dlvrycmpnycd}"
                                th:data-api="|/api/c0801w02/companylist/*{apkihoncd}/*{shopcd}|"
                                >
                            </select>
                            
                        </td>
                    </tr>
                    <tr>
                        <th>伝票番号</th>
                        <td>
                            <!--/* 「伝票番号」 */-->
                            <div th:switch="*{syorimode}">
                                <span th:case="1">（新規登録）</span>
                                <span th:case="*">
                                    <span th:text="*{dnpyno}"></span>
                                </span>
                            </div>
                        </td>
                        <td>
                            <!--/* 「データ作成元区分名称」 */-->
                            <span th:text="*{datsksmotokbnnm}"></span>
                        </td>
                        <th>配達パターン</th>
                        <td>
                            <!--/* 「配達パターン」 */-->
                            <span id="lbldlvrypattern" th:text="*{dlvrypattern}"></span>
                        </td>
                        <th id="reftnshacd_label">
                            <!--/* 「配達担当者」 */-->
                            <th:block th:if="*{authflag eq 'f'}">
                                <a id="reftnshacd" href="javascript:void(0);" tabindex="-1">配達担当者</a>
                            </th:block>
                            <th:block th:unless="*{authflag eq 'f'}">
                                配達担当者
                            </th:block>
                        </th>
                        <td>
                            <!--/* 「配達担当者コード」 */-->
                            <input
                                th:value="*{dlvrytnshacd}"
                                id="txtdlvrytnshacd"
                                name="txtdlvrytnshacd"
                                data-hidden-element="baseBean.dlvrytnshacd"
                                type="text"
                                size="6"
                                maxLength="6"
                                class="aci-zero-padding-format ifm-mode-enable code coodinate-hidden-element"
                                style="width:40px"
                                th:readonly="*{authflag != 'f'}"
                                th:tabindex="*{authflag != 'f' ? '-1' : ''}">
                            <!--/* 「配達担当者名」 */-->
                            <span id="baseBean.dlvrytnshamei" th:text="*{dlvrytnshamei}"></span>
                        </td>
                    </tr>
                </table>
            </div>
            <!--/* 受注日・配達日関連 */-->
            <div id="c0801w02_base_date" class="blocksmall" style="width: 1052px; margin-left: 5px;" th:object="${c0801W02Form.baseBean}">
                <table style="border:0; padding:2px; width:100% " class="border">
                    <!--* 列幅指定 */-->
                    <colgroup>
                        <col width="68">
                        <col width="65">
                        <col width="85">
                        <col width="90">
                        <col width="300">
                        <col width="70">
                        <col width="54">
                        <col width="60">
                        <col width="214">
                    </colgroup>
                    <tr>
                        <th class="hissu">受注日</th>
                        <td>
                            <!--/* 「受注日」 */-->
                            <input 
                                type="text"
                                th:field="*{acptdd}"
                                size="10"
                                maxLength="8"
                                class="ifm-mode-enable hasDatepicker ifm-mode-enable"
                                th:readonly="*{authflag != 'f'}"
                                th:tabindex="*{authflag != 'f' ? '-1' : ''}"
                                style="width:62px">
                        </td>
                        <td>
                            <!--/* 「受注経路区分」プルダウン */-->
                            <select
                                th:disabled="*{authflag != 'f'}"
                                th:field="*{acptrcptkeirokbn}"
                                class="aci-ajax-parts"
                                data-template="template_select"
                                th:data-default="*{acptrcptkeirokbn}"
                                data-api="/api/parts/s02m006t/000/000/147"
                                >
                            </select>
                        </td>
                        <th class="hissu">配達予定日・時刻</th>
                        <td>
                            <!--/* 「配達予定日」 */-->
                            <input th:field="*{dlvryytidd}"
                                type="text"
                                size="10"
                                maxLength="8"
                                th:readonly="*{authflag != 'f'}"
                                th:tabindex="*{authflag != 'f' ? '-1' : ''}"
                                class="ifm-mode-enable hasDatepicker binding-calculator-property">
                            <!--/* 「配達希望時間区分」プルダウン */-->
                            <select
                                th:disabled="*{authflag != 'f'}"
                                th:field="*{dlvrykibojikankbn}"
                                class="aci-ajax-parts"
                                data-template="template_select"
                                th:data-default="*{dlvrykibojikankbn}"
                                data-api="/api/parts/s02m006t/000/000/012"
                                >
                            </select>
                            <!--/* 「配達希望時間」 */-->
                            <input th:field="*{dlvrykibojikan}"
                                type="text"
                                size="5"
                                maxLength="4"
                                th:readonly="*{authflag != 'f'}"
                                th:tabindex="*{authflag != 'f' ? '-1' : ''}"
                                class="ifm-mode-enable aci-time-format"
                                style="margin-right: -2px; width:35px">
                            <!--/* 「配達希望時間（終了）」 */-->
                            <input th:field="*{dlvrykibojikanshry}"
                                type="text"
                                size="5"
                                maxLength="4"
                                th:readonly="*{authflag != 'f'}"
                                th:tabindex="*{authflag != 'f' ? '-1' : ''}"
                                class="ifm-mode-enable aci-time-format"
                                style="margin-right: -2px; width:35px">
                        </td>
                        <th>留守置き</th>
                        <td>
                            <!--/* 「留守置き」チェックボックス */-->
                            <input th:field="*{fzaiokikanoflg}"
                                type="checkbox"
                                th:value="1"
                                th:disabled="*{authflag != 'f'}">
                            <label th:for="${#ids.prev('baseBean.fzaiokikanoflg')}">可能</label>
                        </td>
                        <th>納品先情報</th>
                        <td>
                            <!--/* 「納品先情報１」*/-->
                            <span th:text="*{nohinsakijohon1}"></span>
                            <!--/* 「納品先情報１」*/-->
                            <span th:text="*{nohinsakijohon2}"></span>
                        </td>
                    </tr>
                </table>
            </div>
            
            <!--/* 前回受注 */-->
            <div id="c0801w02_base_previous" class="blocksmall" style="width: 1052px; margin-left: 5px;" th:object="${c0801W02Form.baseBean}">
                <div class="listbodyheader">
                    <table style="border:0; padding:2px; width: 100%" class="border">
                        <colgroup>
                            <col width="60">
                            <col width="60">
                            <col width="60">
                            <col width="30">
                            <col width="30">
                            <col width="30">
                            <col width="30">
                            <col width="30">
                            <col width="30">
                            <col width="60">
                            <col width="60">
                            <col width="110">
                            <col width="110">
                            <col width="100">
                            <col width="176">
                        </colgroup>
                        <tr>
                            <th rowspan="2">受注区分</th>
                            <th rowspan="2">受注日</th>
                            <th rowspan="2">配達日</th>
                            <th colspan="2">レギュラー</th>
                            <th colspan="2">スリム</th>
                            <th colspan="2">その他</th>
                            <th rowspan="2">製品水売上</th>
                            <th rowspan="2">その他売上</th>
                            <th rowspan="2">受注担当者</th>
                            <th rowspan="2">配達担当者</th>
                            <th rowspan="2">ステータス</th>
                            <td rowspan="3" style="padding-left: 1px;padding-right: 2px;">
                                <!--/* 「前回配達実績から複写」ボタン*/-->
                                <!--/* 前回受注日が設定されている場合のみ活性*/-->
                                <button id="btnfukusha"
                                    name="btnfukusha"
                                    type="button"
                                    style="width:100%"
                                    class="button aci-search"
                                    th:data-api="@{/api/c0801w02/meisailistwzpre}"
                                    data-bind_target="c0801w02_meisai_list"
                                    data-query-filters='[
                                        "(?!detailBeanList).*"
